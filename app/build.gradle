plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rishiraj.anywheredoor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rishiraj.anywheredoor'
        minSdk 29
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        release {
            storeFile file('anywheredoor.keystore')
            storePassword 'anywheredoor'
            keyAlias 'anywheredoor'
            keyPassword 'anywheredoor'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
